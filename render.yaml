services:
  - type: web
    name: travellite-pro-cloud
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: travellite-cloud-db
          property: connectionString
      - key: BILLPLZ_API_KEY
        sync: false
      - key: BILLPLZ_COLLECTION_ID
        sync: false
      - key: BILLPLZ_X_SIGNATURE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
databases:
  - name: travellite-cloud-db
    plan: basic-256mb
    databaseName: travellite
    user: travellite
